<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>ראשממשלת.ישראל — תמכו בראש הממשלה שלכם</title>
<meta name="description" content="לחצו על המועמד שלכם והשפיעו על תוצאות הבחירות לכנסת ה-26">
<meta property="og:title" content="ראשממשלת.ישראל — מי יוביל את ישראל?">
<meta property="og:description" content="תמכו במועמד שלכם. כל לחיצה חשובה.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700;900&family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --bg-2: #11111a;
    --ink: #ededf0;
    --ink-soft: #8a8a96;
    --ink-faint: #6a6a76;
    --line: rgba(255,255,255,0.06);
    --line-strong: rgba(255,255,255,0.12);
    --surface: rgba(255,255,255,0.04);
    --surface-2: rgba(255,255,255,0.08);
    --accent: #f59e0b;
    --c-bibi: #3b82f6;
    --c-bennett: #22c55e;
    --c-eisenkot: #06b6d4;
    --c-lieberman: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Heebo', system-ui, sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
    min-height: 100dvh;
  }
  body {
    background-image:
      radial-gradient(circle at 15% 5%, rgba(59,130,246,0.15), transparent 40%),
      radial-gradient(circle at 85% 95%, rgba(245,158,11,0.10), transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(34,197,94,0.04), transparent 60%);
    background-attachment: fixed;
  }

  header {
    position: relative; z-index: 2;
    padding: 24px 20px 16px;
    padding-top: max(24px, env(safe-area-inset-top));
    text-align: center;
    border-bottom: 1px solid var(--line);
  }
  .domain { font-family: 'Frank Ruhl Libre', serif; font-weight: 300; font-size: 12px; letter-spacing: 0.2em; color: var(--ink-soft); text-transform: uppercase; }
  h1 {
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 700;
    font-size: clamp(24px, 6vw, 38px);
    line-height: 1.1;
    margin-top: 8px;
    letter-spacing: -0.02em;
    color: #ffffff;
  }
  .subtitle { margin-top: 8px; font-size: 13px; color: var(--ink-soft); max-width: 380px; margin-inline: auto; line-height: 1.5; }
  .live-dot {
    display: inline-block; width: 6px; height: 6px;
    background: var(--accent); border-radius: 50%;
    margin-left: 6px; animation: pulse 1.4s ease-in-out infinite;
    vertical-align: middle;
    box-shadow: 0 0 8px var(--accent);
  }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.7); } }

  .countdown { margin-top: 16px; display: flex; justify-content: center; gap: 6px; direction: ltr; }
  .countdown-unit {
    background: var(--surface);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line-strong);
    padding: 8px 10px;
    border-radius: 10px;
    min-width: 54px;
    display: flex; flex-direction: column; align-items: center; line-height: 1;
  }
  .countdown-num { font-family: 'Frank Ruhl Libre', serif; font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; color: #ffffff; }
  .countdown-label { font-size: 9px; margin-top: 4px; letter-spacing: 0.12em; color: var(--ink-soft); text-transform: uppercase; }
  .countdown-caption { margin-top: 10px; font-size: 10px; color: var(--ink-faint); letter-spacing: 0.12em; text-transform: uppercase; }

  .arena { position: relative; z-index: 1; padding: 24px 12px 16px; max-width: 1200px; margin: 0 auto; }
  .candidates {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    align-items: stretch;
  }

  .cand {
    position: relative;
    cursor: pointer;
    user-select: none;
    text-align: center;
    padding: 14px 8px 16px;
    border-radius: 16px;
    transition: background 0.4s, transform 0.2s, border-color 0.4s, box-shadow 0.4s;
    background: var(--surface);
    border: 1px solid var(--line);
  }
  .cand:active { transform: scale(0.97); }
  .cand.leader {
    background: var(--surface-2);
    border-color: var(--line-strong);
    box-shadow: 0 0 32px -8px var(--bar-color), inset 0 1px 0 rgba(255,255,255,0.05);
  }

  .face-wrap { position: relative; width: 100%; aspect-ratio: 1; max-width: 140px; margin: 0 auto; }
  .face-svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 6px 18px rgba(0,0,0,0.5)); }
  .face-svg * { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

  .crown {
    position: absolute; top: -4px; left: 50%;
    transform: translateX(-50%) translateY(0) rotate(-8deg);
    font-size: 22px; opacity: 0;
    transition: opacity 0.4s, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 3;
    filter: drop-shadow(0 2px 8px rgba(255,200,0,0.6));
  }
  .cand.leader .crown { opacity: 1; transform: translateX(-50%) translateY(-12px) rotate(-8deg); }

  .cand-name { margin-top: 12px; font-family: 'Frank Ruhl Libre', serif; font-weight: 600; font-size: clamp(14px, 3.5vw, 17px); letter-spacing: -0.01em; white-space: nowrap; color: #ffffff; }
  .cand-party { font-size: 10px; color: var(--ink-soft); margin-top: 2px; letter-spacing: 0.05em; }

  .pct-bar {
    margin-top: 10px;
    width: 100%; height: 5px;
    background: rgba(255,255,255,0.06);
    border-radius: 999px; overflow: hidden;
  }
  .pct-fill {
    height: 100%;
    background: var(--bar-color);
    border-radius: 999px;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    width: 0%;
    box-shadow: 0 0 10px var(--bar-color);
  }
  .pct-text {
    margin-top: 6px;
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 600;
    font-size: 17px;
    font-variant-numeric: tabular-nums;
    transition: color 0.4s, font-size 0.4s, text-shadow 0.4s;
    color: var(--ink);
  }
  .cand.leader .pct-text {
    font-size: 20px;
    color: var(--bar-color);
    text-shadow: 0 0 16px var(--bar-color);
  }

  .particle {
    position: fixed; pointer-events: none;
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 800; font-size: 20px;
    animation: rise 1.1s ease-out forwards;
    z-index: 50;
    text-shadow: 0 0 10px currentColor;
  }
  @keyframes rise {
    0% { opacity: 0; transform: translate(-50%, 0) scale(0.5); }
    15% { opacity: 1; transform: translate(-50%, -10px) scale(1.2); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), -90px) scale(0.7); }
  }
  .shockwave {
    position: absolute; top: 50%; left: 50%;
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--bar-color);
    transform: translate(-50%, -50%);
    pointer-events: none;
    animation: shock 0.7s ease-out forwards;
    box-shadow: 0 0 16px var(--bar-color);
  }
  @keyframes shock { 0% { opacity: 0.8; width: 30px; height: 30px; } 100% { opacity: 0; width: 220px; height: 220px; } }

  .chart-section {
    position: relative; z-index: 1;
    max-width: 1200px; margin: 0 auto;
    padding: 24px 20px 16px;
    border-top: 1px solid var(--line);
  }
  .chart-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .chart-title { font-family: 'Frank Ruhl Libre', serif; font-weight: 600; font-size: 18px; color: #ffffff; }
  .chart-meta { font-size: 10px; color: var(--ink-faint); letter-spacing: 0.08em; text-transform: uppercase; }
  .chart-container { position: relative; width: 100%; height: 220px; }
  svg.chart { width: 100%; height: 100%; overflow: visible; }
  .chart-line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 14px; justify-content: center; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-soft); }
  .legend-swatch { width: 9px; height: 9px; border-radius: 2px; }

  /* ============ קאונטר לחיצות גלובלי ============ */
  .counter-section {
    position: relative;
    z-index: 1;
    background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(245,158,11,0.10));
    padding: 22px 20px 26px;
    text-align: center;
    border-top: 1px solid var(--line-strong);
    overflow: hidden;
  }
  .counter-section::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 50% 0%, rgba(255,255,255,0.04), transparent 50%);
    pointer-events: none;
  }
  .counter-label {
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
    text-transform: uppercase;
    margin-bottom: 8px;
    position: relative;
  }
  .counter-number {
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 700;
    font-size: clamp(36px, 9vw, 56px);
    color: #ffffff;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
    line-height: 1;
    position: relative;
    text-shadow: 0 0 24px rgba(255,255,255,0.15);
  }
  .counter-caption {
    margin-top: 8px;
    font-size: 11px;
    color: var(--ink-faint);
    position: relative;
  }
  .counter-pulse {
    display: inline-block;
    color: var(--accent);
    animation: counterPulse 1.4s ease-in-out infinite;
    margin-right: 4px;
  }
  @keyframes counterPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes counterBump { 0%,100% { transform: scale(1); } 30% { transform: scale(1.08); } }
  .counter-bump { animation: counterBump 0.28s ease; }

  /* ============ פס שיתוף תחתון ============ */
  .share-bar {
    position: sticky;
    bottom: 0; left: 0; right: 0;
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: var(--ink);
    padding: 14px 16px;
    padding-bottom: max(14px, env(safe-area-inset-bottom));
    text-align: center;
    font-size: 13px;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    border-top: 1px solid var(--line-strong);
  }
  .share-bar strong { font-weight: 600; color: #ffffff; }
  .share-btn {
    background: #ffffff;
    color: #0a0a0f;
    border: none;
    padding: 8px 16px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
  }
  .share-btn:active { transform: scale(0.95); background: var(--accent); }

  /* ============ מובייל ============ */
  @media (max-width: 520px) {
    .candidates { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .chart-container { height: 180px; }
    .countdown-unit { min-width: 48px; padding: 7px 8px; }
    .countdown-num { font-size: 18px; }
    h1 { font-size: 24px; }
    .arena { padding: 20px 10px 12px; }
    .cand { padding: 12px 6px 14px; }
    .chart-section { padding: 20px 16px 14px; }
    .counter-section { padding: 20px 16px 24px; }
  }
  @media (max-width: 360px) {
    .countdown-unit { min-width: 44px; padding: 6px 7px; }
    .countdown-num { font-size: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="domain">ראשממשלת.ישראל</div>
  <h1>תמכו בראש הממשלה שלכם</h1>
  <div class="subtitle">כל לחיצה קובעת<span class="live-dot"></span></div>

  <div class="countdown">
    <div class="countdown-unit"><span class="countdown-num" id="cd-days">--</span><span class="countdown-label">ימים</span></div>
    <div class="countdown-unit"><span class="countdown-num" id="cd-hours">--</span><span class="countdown-label">שעות</span></div>
    <div class="countdown-unit"><span class="countdown-num" id="cd-mins">--</span><span class="countdown-label">דקות</span></div>
    <div class="countdown-unit"><span class="countdown-num" id="cd-secs">--</span><span class="countdown-label">שניות</span></div>
  </div>
  <div class="countdown-caption">עד הבחירות לכנסת ה-26 • 27 באוקטובר 2026</div>
</header>

<main class="arena">
  <div class="candidates" id="candidates"></div>
</main>

<section class="chart-section">
  <div class="chart-header">
    <div class="chart-title">מגמת תמיכה</div>
    <div class="chart-meta">עדכון • <span id="last-update">עכשיו</span></div>
  </div>
  <div class="chart-container">
    <svg class="chart" id="chart" viewBox="0 0 800 220" preserveAspectRatio="none"></svg>
  </div>
  <div class="legend" id="legend"></div>
</section>

<!-- קאונטר לחיצות גלובלי -->
<section class="counter-section">
  <div class="counter-label">סך הלחיצות באתר</div>
  <div class="counter-number" id="total-counter">0</div>
  <div class="counter-caption"><span class="counter-pulse">●</span>כל לחיצה נספרת</div>
</section>

<div class="share-bar">
  <strong>תמכו ושתפו — אל תתנו לו ליפול</strong>
  <button class="share-btn" id="share">שתפו ←</button>
</div>

<script>
/* ============================================================
   מועמדים
   ============================================================ */
const candidates = [
  { id: 'bibi', name: 'נתניהו', party: 'הליכוד', color: 'var(--c-bibi)', hex: '#3b82f6', traits: { hair: 'silver-side-part', faceShape: 'round', mole: true, bagsUnderEyes: true, thickLips: true }, pct: 25 },
  { id: 'bennett', name: 'בנט', party: 'ביחד', color: 'var(--c-bennett)', hex: '#22c55e', traits: { hair: 'bald', faceShape: 'oval', kippah: true, thickEyebrows: true, stubble: true }, pct: 25 },
  { id: 'eisenkot', name: 'אייזנקוט', party: 'ישר!', color: 'var(--c-eisenkot)', hex: '#06b6d4', traits: { hair: 'short-gray', faceShape: 'square', sternMouth: true, thinFace: true }, pct: 25 },
  { id: 'lieberman', name: 'ליברמן', party: 'ישראל ביתנו', color: 'var(--c-lieberman)', hex: '#f59e0b', traits: { hair: 'short-gray', faceShape: 'round', beard: true, jowls: true }, pct: 25 },
];

let totalClicks = 0;
const FIREBASE_URL = 'https://rosh-memshala-default-rtdb.europe-west1.firebasedatabase.app/votes';
const pendingClicks = Object.fromEntries(candidates.map(c => [c.id, 0]));

/* ============================================================
   טיימר
   ============================================================ */
const ELECTION_DATE = new Date('2026-10-27T07:00:00+03:00');
function updateCountdown() {
  const now = new Date();
  let diff = Math.max(0, ELECTION_DATE - now);
  const days = Math.floor(diff / 86400000); diff -= days * 86400000;
  const hours = Math.floor(diff / 3600000); diff -= hours * 3600000;
  const mins = Math.floor(diff / 60000); diff -= mins * 60000;
  const secs = Math.floor(diff / 1000);
  document.getElementById('cd-days').textContent = days;
  document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
  document.getElementById('cd-mins').textContent = String(mins).padStart(2, '0');
  document.getElementById('cd-secs').textContent = String(secs).padStart(2, '0');
}
updateCountdown();
setInterval(updateCountdown, 1000);

/* ============================================================
   SVG פרצוף עם רמיזות
   ============================================================ */
function buildFaceSVG(c) {
  const t = c.traits;
  const id = c.id;
  const skin = '#e8b890';
  const hairColor = (t.hair === 'silver-side-part' || t.hair === 'short-gray') ? '#d0d0d0' : '#3a3a3a';

  let faceShape = '';
  if (t.thinFace) faceShape = '<path d="M 52 75 Q 52 45 100 44 Q 148 45 148 75 L 148 135 Q 148 180 100 188 Q 52 180 52 135 Z" fill="' + skin + '"/>';
  else if (t.faceShape === 'round') faceShape = '<ellipse cx="100" cy="110" rx="62" ry="72" fill="' + skin + '"/>';
  else if (t.faceShape === 'oval') faceShape = '<ellipse cx="100" cy="112" rx="56" ry="74" fill="' + skin + '"/>';
  else faceShape = '<path d="M 42 85 Q 42 50 100 48 Q 158 50 158 85 L 158 130 Q 158 178 100 184 Q 42 178 42 130 Z" fill="' + skin + '"/>';

  let jowls = '';
  if (t.jowls) jowls = '<path d="M 48 145 Q 42 168 70 175 Q 60 165 50 150 Z" fill="' + skin + '"/><path d="M 152 145 Q 158 168 130 175 Q 140 165 150 150 Z" fill="' + skin + '"/>';

  let hair = '';
  if (t.hair === 'silver-side-part') {
    hair = '<path d="M 38 78 Q 36 38 100 36 Q 168 38 162 82 Q 156 60 110 56 Q 70 58 50 78 Z" fill="' + hairColor + '"/><path d="M 50 72 Q 90 50 130 60 Q 130 70 100 68 Q 70 70 50 78 Z" fill="#a0a0a0" opacity="0.6"/>';
  } else if (t.hair === 'short-gray') {
    hair = '<path d="M 44 78 Q 44 46 100 44 Q 156 46 156 80 Q 130 62 100 62 Q 70 62 44 78 Z" fill="' + hairColor + '"/>';
  } else if (t.hair === 'bald') {
    hair = '<path d="M 44 100 Q 44 86 56 80 L 60 96 Z" fill="#a08770" opacity="0.5"/><path d="M 156 100 Q 156 86 144 80 L 140 96 Z" fill="#a08770" opacity="0.5"/>';
  }

  let kippah = '';
  if (t.kippah) kippah = '<ellipse cx="100" cy="50" rx="30" ry="11" fill="#4a7849" stroke="#2d4a2c" stroke-width="1.5"/><path d="M 75 50 Q 100 46 125 50" stroke="#2d4a2c" stroke-width="0.8" fill="none" opacity="0.6"/><path d="M 78 53 Q 100 49 122 53" stroke="#2d4a2c" stroke-width="0.8" fill="none" opacity="0.6"/>';

  let stubble = '';
  if (t.stubble) stubble = '<path d="M 56 130 Q 100 158 144 130 Q 140 152 100 162 Q 60 152 56 130 Z" fill="#6a6a6a" opacity="0.3"/>';

  let beard = '';
  if (t.beard) beard = '<path d="M 56 128 Q 58 172 100 182 Q 142 172 144 128 Q 138 156 100 162 Q 62 156 56 128 Z" fill="#c0c0c0"/><path d="M 70 140 Q 100 168 130 140" stroke="#909090" stroke-width="0.6" fill="none" opacity="0.4"/>';

  let mole = '';
  if (t.mole) mole = '<circle cx="124" cy="155" r="2" fill="#5a3a1a"/>';

  let eyebags = '';
  if (t.bagsUnderEyes) eyebags = '<path d="M 70 116 Q 78 119 86 116" stroke="#b89868" stroke-width="1.2" fill="none" opacity="0.6"/><path d="M 114 116 Q 122 119 130 116" stroke="#b89868" stroke-width="1.2" fill="none" opacity="0.6"/>';

  const tie = '<path d="M 88 200 L 100 188 L 112 200 L 108 220 L 100 230 L 92 220 Z" fill="' + c.hex + '" stroke="#0a0a0a" stroke-width="1.5"/>';
  const body = '<path d="M 75 175 L 80 195 Q 70 200 50 215 Q 30 230 30 250 L 170 250 Q 170 230 150 215 Q 130 200 120 195 L 125 175 Z" fill="#1a1a22"/>';
  const eyes = '<g id="eyes-' + id + '"><ellipse cx="78" cy="108" rx="5" ry="6" fill="#0a0a0a"/><ellipse cx="122" cy="108" rx="5" ry="6" fill="#0a0a0a"/><circle cx="79.5" cy="106" r="1.5" fill="#ffffff"/><circle cx="123.5" cy="106" r="1.5" fill="#ffffff"/></g>';
  const browWidth = t.thickEyebrows ? 5 : 3.5;
  const brows = '<g id="brows-' + id + '"><path id="brow-left-' + id + '" d="M 68 92 Q 78 88 88 92" stroke="#2a2a2a" stroke-width="' + browWidth + '" fill="none" stroke-linecap="round"/><path id="brow-right-' + id + '" d="M 112 92 Q 122 88 132 92" stroke="#2a2a2a" stroke-width="' + browWidth + '" fill="none" stroke-linecap="round"/></g>';
  const mouthWidth = t.thickLips ? 4 : (t.sternMouth ? 4 : 3);
  const mouth = '<path id="mouth-' + id + '" d="M 82 145 Q 100 145 118 145" stroke="#7a2a2a" stroke-width="' + mouthWidth + '" fill="none" stroke-linecap="round"/>';
  const cheeks = '<g id="cheeks-' + id + '" opacity="0"><circle cx="65" cy="130" r="8" fill="#ff9999" opacity="0.5"/><circle cx="135" cy="130" r="8" fill="#ff9999" opacity="0.5"/></g>';
  const blush = '<g id="blush-' + id + '" opacity="0"><ellipse cx="65" cy="125" rx="14" ry="6" fill="#ff8888" opacity="0.5"/><ellipse cx="135" cy="125" rx="14" ry="6" fill="#ff8888" opacity="0.5"/></g>';
  const tear = '<path id="tear-' + id + '" d="M 78 118 Q 76 124 78 130 Q 80 124 78 118 Z" fill="#6bb6ff" opacity="0"/>';
  const tear2 = '<path id="tear2-' + id + '" d="M 122 118 Q 120 124 122 130 Q 124 124 122 118 Z" fill="#6bb6ff" opacity="0"/>';
  const sweat = '<path id="sweat-' + id + '" d="M 138 88 Q 136 96 138 104 Q 140 96 138 88 Z" fill="#7bc8ff" opacity="0"/>';
  const sweat2 = '<path id="sweat2-' + id + '" d="M 62 88 Q 60 96 62 104 Q 64 96 62 88 Z" fill="#7bc8ff" opacity="0"/>';
  const pale = '<ellipse id="pale-' + id + '" cx="100" cy="115" rx="62" ry="72" fill="#ffffff" opacity="0"/>';

  return '<svg class="face-svg" viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">' +
    '<circle cx="100" cy="115" r="92" fill="' + c.hex + '" opacity="0.15"/>' +
    body + tie + faceShape + jowls + beard + stubble + hair + kippah + pale +
    brows + eyes + eyebags + tear + tear2 + sweat + sweat2 + blush + cheeks + mole + mouth +
  '</svg>';
}

function updateFaceMood(id, mood) {
  const m = Math.max(0, Math.min(1, mood));
  const mouthY = 145, cx = 100;
  const cornerOffset = (m - 0.5) * 16;
  const depth = Math.abs(m - 0.5) * 28;
  const curveY = m > 0.5 ? mouthY + depth : mouthY - depth;
  const mouthEl = document.getElementById('mouth-' + id);
  if (mouthEl) mouthEl.setAttribute('d', 'M ' + (cx - 22) + ' ' + (mouthY - cornerOffset) + ' Q ' + cx + ' ' + curveY + ' ' + (cx + 22) + ' ' + (mouthY - cornerOffset));
  const browLeft = document.getElementById('brow-left-' + id);
  const browRight = document.getElementById('brow-right-' + id);
  if (browLeft && browRight) {
    if (m < 0.5) {
      const innerY = 92 - (0.5 - m) * 8;
      const outerY = 92 + (0.5 - m) * 4;
      browLeft.setAttribute('d', 'M 68 ' + outerY + ' Q 78 ' + (outerY - 2) + ' 88 ' + innerY);
      browRight.setAttribute('d', 'M 112 ' + innerY + ' Q 122 ' + (outerY - 2) + ' 132 ' + outerY);
    } else {
      const liftY = 92 - (m - 0.5) * 6;
      browLeft.setAttribute('d', 'M 68 ' + liftY + ' Q 78 ' + (liftY - 4) + ' 88 ' + liftY);
      browRight.setAttribute('d', 'M 112 ' + liftY + ' Q 122 ' + (liftY - 4) + ' 132 ' + liftY);
    }
  }
  const eyes = document.getElementById('eyes-' + id);
  if (eyes) {
    const squint = m > 0.7 ? (m - 0.7) * 0.6 : 0;
    eyes.style.transform = 'scaleY(' + (1 - squint) + ')';
    eyes.style.transformOrigin = '100px 108px';
  }
}

/* ============================================================
   תגובות טבעיות
   ============================================================ */
const upReactions = ['cheeks', 'blush'];
const downReactions = ['tear', 'tear2', 'sweat', 'sweat2', 'pale'];
const activeEffects = {};
function flashEffect(id, effect, duration) {
  duration = duration || (1500 + Math.random() * 1500);
  const el = document.getElementById(effect + '-' + id);
  if (!el) return;
  const targetOpacity = effect === 'pale' ? 0.3 : 1;
  el.setAttribute('opacity', targetOpacity);
  if (activeEffects[id] && activeEffects[id][effect]) clearTimeout(activeEffects[id][effect]);
  activeEffects[id] = activeEffects[id] || {};
  activeEffects[id][effect] = setTimeout(() => {
    el.setAttribute('opacity', 0);
    if (activeEffects[id]) delete activeEffects[id][effect];
  }, duration);
}
function triggerRandomReaction(id, direction) {
  const pool = direction === 'up' ? upReactions : downReactions;
  if (Math.random() < 0.4) return;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  flashEffect(id, pick);
}

/* ============================================================
   רינדור
   ============================================================ */
const container = document.getElementById('candidates');
const elemRefs = {};
candidates.forEach(c => {
  const el = document.createElement('div');
  el.className = 'cand';
  el.dataset.id = c.id;
  el.style.setProperty('--bar-color', c.hex);
  el.innerHTML = '<div class="face-wrap"><div class="crown">👑</div>' + buildFaceSVG(c) + '</div><div class="cand-name">' + c.name + '</div><div class="cand-party">' + c.party + '</div><div class="pct-bar"><div class="pct-fill" data-fill></div></div><div class="pct-text" data-pct>25.0%</div>';
  container.appendChild(el);
  elemRefs[c.id] = el;
  el.addEventListener('click', () => handleClick(c, el));
  setTimeout(() => updateFaceMood(c.id, 0.5), 50);
});

function updateTotalCounter() {
  const counter = document.getElementById('total-counter');
  counter.textContent = totalClicks.toLocaleString('he-IL');
  counter.classList.remove('counter-bump');
  void counter.offsetWidth;
  counter.classList.add('counter-bump');
}

function handleClick(c, el) {
  totalClicks++;
  pendingClicks[c.id]++;
  updateTotalCounter();

  const before = Object.fromEntries(candidates.map(x => [x.id, x.pct]));
  const sorted = [...candidates].sort((a, b) => b.pct - a.pct);
  const leader = sorted[0];
  const transfer = 0.3;
  if (leader.id !== c.id && leader.pct > transfer + 1) { leader.pct -= transfer; c.pct += transfer; }
  else if (leader.id === c.id) {
    const second = sorted[1];
    if (second.pct > transfer + 1) { second.pct -= transfer; c.pct += transfer; }
  } else {
    const others = candidates.filter(x => x.id !== c.id);
    const total = others.reduce((s, x) => s + x.pct, 0);
    if (total > transfer + others.length) { others.forEach(o => o.pct -= transfer * (o.pct / total)); c.pct += transfer; }
  }
  normalize();
  render();
  spawnParticle(el, c);
  spawnShockwave(el);
  if (navigator.vibrate) navigator.vibrate(8);
  const THRESHOLD = 0.15;
  candidates.forEach(x => {
    const delta = x.pct - before[x.id];
    if (delta > THRESHOLD) triggerRandomReaction(x.id, 'up');
    else if (delta < -THRESHOLD) triggerRandomReaction(x.id, 'down');
  });
}

function normalize() {
  candidates.forEach(c => { if (c.pct < 1) c.pct = 1; });
  const total = candidates.reduce((s, c) => s + c.pct, 0);
  candidates.forEach(c => c.pct = (c.pct / total) * 100);
}
function render() {
  const maxPct = Math.max(...candidates.map(c => c.pct));
  candidates.forEach(c => {
    const el = elemRefs[c.id];
    el.querySelector('[data-fill]').style.width = c.pct + '%';
    el.querySelector('[data-pct]').textContent = c.pct.toFixed(1) + '%';
    const mood = Math.max(0, Math.min(1, (c.pct - 5) / 45));
    updateFaceMood(c.id, mood);
    if (c.pct === maxPct) el.classList.add('leader');
    else el.classList.remove('leader');
  });
}
function spawnParticle(el, c) {
  const wrap = el.querySelector('.face-wrap');
  const rect = wrap.getBoundingClientRect();
  const p = document.createElement('div');
  p.className = 'particle';
  p.textContent = '+';
  p.style.color = c.hex;
  p.style.left = (rect.left + rect.width / 2) + 'px';
  p.style.top = (rect.top + rect.height / 2) + 'px';
  p.style.setProperty('--dx', (Math.random() * 50 - 25) + 'px');
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 1100);
}
function spawnShockwave(el) {
  const wrap = el.querySelector('.face-wrap');
  const wave = document.createElement('div');
  wave.className = 'shockwave';
  wrap.appendChild(wave);
  setTimeout(() => wave.remove(), 700);
}

/* ============================================================
   גרף
   ============================================================ */
const chart = document.getElementById('chart');
const W = 800, H = 220, PAD = 16;
const history = candidates.map(c => ({ id: c.id, data: [c.pct] }));
const MAX_HISTORY = 40;
function renderChart() {
  chart.innerHTML = '';
  for (let i = 0; i <= 4; i++) {
    const y = PAD + (H - PAD * 2) * (i / 4);
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', PAD); l.setAttribute('y1', y);
    l.setAttribute('x2', W - PAD); l.setAttribute('y2', y);
    l.setAttribute('stroke', '#ffffff'); l.setAttribute('stroke-opacity', '0.06');
    chart.appendChild(l);
  }
  history.forEach(h => {
    const c = candidates.find(x => x.id === h.id);
    if (h.data.length < 2) return;
    const points = h.data.map((v, i) => {
      const x = PAD + (W - PAD * 2) * (i / (MAX_HISTORY - 1));
      const y = H - PAD - (H - PAD * 2) * Math.min(1, v / 60);
      return x + ',' + y;
    }).join(' ');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    path.classList.add('chart-line');
    path.setAttribute('points', points);
    path.setAttribute('stroke', c.hex);
    path.style.filter = 'drop-shadow(0 0 6px ' + c.hex + ')';
    chart.appendChild(path);
    const lastVal = h.data[h.data.length - 1];
    const lastIdx = h.data.length - 1;
    const lx = PAD + (W - PAD * 2) * (lastIdx / (MAX_HISTORY - 1));
    const ly = H - PAD - (H - PAD * 2) * Math.min(1, lastVal / 60);
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('cx', lx); dot.setAttribute('cy', ly);
    dot.setAttribute('r', 4); dot.setAttribute('fill', c.hex);
    dot.style.filter = 'drop-shadow(0 0 8px ' + c.hex + ')';
    chart.appendChild(dot);
  });
}
setInterval(() => {
  history.forEach(h => {
    const c = candidates.find(x => x.id === h.id);
    h.data.push(c.pct);
    if (h.data.length > MAX_HISTORY) h.data.shift();
  });
  renderChart();
  const now = new Date();
  document.getElementById('last-update').textContent = now.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}, 2000);

const legend = document.getElementById('legend');
candidates.forEach(c => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.innerHTML = '<span class="legend-swatch" style="background:' + c.hex + '; box-shadow: 0 0 6px ' + c.hex + '"></span>' + c.name;
  legend.appendChild(item);
});

renderChart();
render();
updateTotalCounter();

/* ============================================================
   סנכרון עם השרת + עדכון קאונטר גלובלי
   ============================================================ */
async function syncWithServer() {
  const batch = { ...pendingClicks };
  Object.keys(pendingClicks).forEach(k => pendingClicks[k] = 0);
  const hasAny = Object.values(batch).some(v => v > 0);
  try {
    if (hasAny) {
      const increments = {};
      candidates.forEach(c => {
        if (batch[c.id] > 0) increments[c.id] = { '.sv': { 'increment': batch[c.id] } };
      });
      await fetch(FIREBASE_URL + '.json', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(increments),
      });
    }
    const res = await fetch(FIREBASE_URL + '.json');
    if (!res.ok) return;
    const totals = await res.json();
    if (totals) {
      const sum = Object.values(totals).reduce((a, b) => a + b, 0);
      if (sum > 0) {
        candidates.forEach(c => { c.pct = (totals[c.id] / sum) * 100; });
        if (sum > totalClicks) {
          totalClicks = sum;
          updateTotalCounter();
        }
        render();
      }
    }
  } catch (e) {
    Object.keys(batch).forEach(k => pendingClicks[k] += batch[k]);
  }
}
setInterval(syncWithServer, 500);

/* ============================================================
   שיתוף
   ============================================================ */
document.getElementById('share').addEventListener('click', async () => {
  const text = 'תמכו בראש הממשלה שלכם 👈';
  const url = window.location.href;
  if (navigator.share) {
    try { await navigator.share({ title: 'ראשממשלת.ישראל', text, url }); } catch(e) {}
  } else {
    try {
      await navigator.clipboard.writeText(url);
      const btn = document.getElementById('share');
      const orig = btn.textContent;
      btn.textContent = 'הקישור הועתק ✓';
      setTimeout(() => btn.textContent = orig, 2000);
    } catch(e) {}
  }
});

document.addEventListener('dblclick', (e) => e.preventDefault());
