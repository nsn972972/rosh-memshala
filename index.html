}

/* ---------- routing via hash: #/daily/YYYY-MM-DD?t=28.4  |  #/c/<seed>?t=.. ---------- */
function parseHash() {
  const h = location.hash.replace(/^#\/?/, ''); const [path, q] = h.split('?');
  const parts = path.split('/'); const t = q && new URLSearchParams(q).get('t');
  const friendTime = t && /^\d{1,2}(\.\d)?$/.test(t) ? parseFloat(t) : null;
  if (parts[0] === 'daily') return { mode: 'daily', date: E.isDateStr(parts[1]) ? parts[1] : E.israelDate(), friendTime };
  if (parts[0] === 'coalition') return { mode: 'coalition', friendTime };
  if (parts[0] === 'c' && /^\d{1,9}$/.test(parts[1] || '')) return { mode: 'classic', seed: +parts[1], friendTime };

}

/* ---------- chamber (120 seats) ---------- */
const SEATS = (() => {
  const rows = 5, R = 150, cx = 160, cy = 162, inner = 0.53;
  const rs = Array.from({ length: rows }, (_, i) => inner + (1 - inner) * i / (rows - 1));
  const tot = rs.reduce((a, b) => a + b, 0);
  const counts = rs.map(r => Math.round(120 * r / tot)); counts[rows - 1] += 120 - counts.reduce((a, b) => a + b, 0);
  const out = [];
  rs.forEach((r, i) => { const n = counts[i]; for (let j = 0; j < n; j++) { const th = Math.PI * j / (n - 1); out.push({ x: cx + R * r * Math.cos(th), y: cy - R * r * Math.sin(th), th, r }); } });
  return out.sort((a, b) => a.th - b.th || a.r - b.r);
})();

/* ---------- animated number ---------- */
function useTween(v, ms = 260) {
  const [d, setD] = useState(v); const from = useRef(v);
  useEffect(() => {
    if (REDUCED) { setD(v); from.current = v; return; }
    const a = from.current, t0 = performance.now(); let raf;
    const step = t => { const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 3), x = Math.round(a + (v - a) * e); setD(x); if (p < 1) raf = requestAnimationFrame(step); else from.current = v; };
    raf = requestAnimationFrame(step); return () => { cancelAnimationFrame(raf); from.current = v; };
  }, [v]);
  return d;
}

function Game({ sc, daily, dateStr, onExit, onFinish, sound, setSound }) {
  const [phase, setPhase] = useState('count'); // count | play | done

  const [burst, setBurst] = useState(false);
  const t0 = useRef(0), done = useRef(false);
  const coal = sc.kind === 'polls';
  const sum = E.sumOf(sc.cards, sel), shown = useTween(sum), state = coal ? (sum >= 61 ? 'win' : 'under') : E.evaluate(sum);

  // 3-2-1 (skippable); timer only starts after it
  const start = useCallback(() => { if (phase !== 'count') return; t0.current = performance.now(); setPhase('play'); if (sound) beep([880], 0.12); }, [phase, sound]);
  useEffect(() => {
    if (phase !== 'count') return;
    if (count === 0) { start(); return; }
    if (sound) beep([440], 0.08);
    const t = setTimeout(() => setCount(count - 1), REDUCED ? 450 : 700); return () => clearTimeout(t);

  useEffect(() => {
    if (phase !== 'play') return; let raf, last = -1;
    const tick = () => {
      const el = (performance.now() - t0.current) / 1000, l = Math.max(0, E.TIME_LIMIT - el), tenth = Math.floor(l * 10);
      if (tenth !== last) { last = tenth; setLeft(l); }
      if (l <= 0 && !done.current) {
        done.current = true; setPhase('done'); const s = E.sumOf(sc.cards, selRef.current), formed = coal && s >= 61;
        if (formed) { setBurst(true); if (sound) beep([523, 659, 784, 1047], 0.11, 'triangle'); } else if (sound) beep([330, 247], 0.18, 'triangle');
        setTimeout(() => onFinish({ won: formed, time: E.TIME_LIMIT, sum: s, picks: selRef.current, taps: tapsRef.current }), formed && !REDUCED ? 900 : 0); return; }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick); return () => cancelAnimationFrame(raf);
  }, [phase]);
  const selRef = useRef(sel); selRef.current = sel; const tapsRef = useRef(taps); tapsRef.current = taps;

  const toggle = useCallback(id => {
    if (phase !== 'play' || done.current) return;
    const next = sel.includes(id) ? sel.filter(x => x !== id) : [...sel, id];
    setSel(next); setTaps(taps + 1);
    const s = E.sumOf(sc.cards, next), ev = E.evaluate(s);
    if (coal) { if (sound) beep([420 + s * 7], 0.07); return; }
    if (sound) beep(ev === 'over' ? [196] : [520 + s * 6], 0.07, ev === 'over' ? 'square' : 'sine', ev === 'over' ? 0.03 : 0.05);
    if (ev === 'win') {
      done.current = true; const elapsed = (performance.now() - t0.current) / 1000;
      setPhase('done'); setBurst(true); if (sound) beep([523, 659, 784, 1047], 0.11, 'triangle');
      setTimeout(() => onFinish({ won: true, time: Math.floor(elapsed * 10) / 10, sum: s, picks: next, taps: taps + 1 }), REDUCED ? 500 : 1300);
    }
  }, [phase, sel, taps, sound]);

  const formGov = () => {
    if (phase !== 'play' || done.current || sum < 61) return;
    done.current = true; const elapsed = (performance.now() - t0.current) / 1000;
    setPhase('done'); setBurst(true); if (sound) beep([523, 659, 784, 1047], 0.11, 'triangle');
    setTimeout(() => onFinish({ won: true, time: Math.floor(elapsed * 10) / 10, sum, picks: sel, taps }), REDUCED ? 400 : 1000);
  };

  useEffect(() => {
    const k = e => {
      if (e.target.tagName === 'INPUT') return;
      if (phase === 'count' && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); start(); }
      const n = parseInt(e.key, 10); const i = n === 0 ? 9 : n - 1; if (n >= 0 && i < sc.cards.length) toggle(sc.cards[i].id);
    };
    addEventListener('keydown', k); return () => removeEventListener('keydown', k);
  }, [phase, toggle]);

  const pct = left / E.TIME_LIMIT, urgent = phase === 'play' && left <= 10;
  const msg = coal ? (sum === 0 ? 'בחר רשימות והגע לרוב של 61' : sum >= 61 ? 'יש רוב: ' + sum + ' מנדטים' : 'חסרים עוד ' + (61 - sum) + ' לרוב')
    : state === 'win' ? 'בדיוק 61!' : state === 'over' ? 'עברת ב־' + (sum - 61) + ' — נסה להחליף כרטיס' : sum === 0 ? 'בחר כרטיסים והגע ל־61 בדיוק' : 'נשארו עוד ' + (61 - sum);

  return html`<div className=${'screen game' + (state === 'win' ? ' won' : '')}>
    <div className="bar">
      <button className="icon-btn" onClick=${onExit} aria-label="חזרה למסך הראשי"><${UiIcon} d=${I_BACK} /></button>
      <div className="bar-title">${coal ? 'ממוצע הסקרים' : daily ? html`האתגר היומי <span className="chip">${fmtDate(dateStr)}</span>` : 'סיבוב דמיוני'}</div>
      <div className=${'timer' + (urgent ? ' urgent' : '')} role="timer" aria-label=${'נותרו ' + Math.ceil(left) + ' שניות'}>${left.toFixed(1)}</div>
      <button className="icon-btn" onClick=${() => setSound(!sound)} aria-pressed=${sound} aria-label=${sound ? 'השתק צלילים' : 'הפעל צלילים'}><${UiIcon} d=${sound ? I_SOUND : I_MUTE} /></button>
    </div>
    <div className="timebar" aria-hidden="true"><i style=${{ transform: 'scaleX(' + pct + ')' }} className=${urgent ? 'urgent' : ''} /></div>

    <section className="meter">
      <${Chamber} fills=${fillsFor(sc.cards, sel)}>
        <text x="160" y="150" textAnchor="middle" className=${'meter-num ' + state}>${shown}</text>
        <text x="160" y="172" textAnchor="middle" className="meter-of">${coal ? 'רוב: 61' : 'מתוך 61'}</text>
      <//>
      <p className=${'msg ' + state} aria-live="polite">${msg}</p>
    </section>

    <section className=${'cards' + (coal ? ' three' : '')} aria-label=${coal ? 'רשימות לפי ממוצע הסקרים' : 'כרטיסי סיעות דמיוניות'}>
      ${sc.cards.map((c, i) => html`<${Card} key=${c.id} c=${c} idx=${i} compact=${coal} selected=${sel.includes(c.id)} disabled=${phase !== 'play'} onToggle=${toggle} />`)}
    </section>

    <div className="foot">
      ${coal && html`<button className="btn primary form" onClick=${formGov} disabled=${phase !== 'play' || sum < 61}>${sum >= 61 ? 'הקם ממשלה' : 'צריך 61 כדי להקים ממשלה'}</button>`}
      <button className="btn text" onClick=${() => { if (phase === 'play') setSel([]); }} disabled=${phase !== 'play' || !sel.length}>איפוס הבחירות</button>
      ${coal && html`<${SourceNote} sc=${sc} />`}
      <${Badge} polls=${coal} />
    </div>

    ${phase === 'count' && html`<button className="cd-overlay" onClick=${start} aria-label="התחל עכשיו">
      <span key=${count} className="cd-num">${count || 'צא!'}</span><span className="cd-skip">נגיעה לדילוג</span></button>`}
    ${burst && html`<${Confetti} />`}
  </div>`;
}

/* ---------- result ---------- */
function Result({ r, sc, daily, dateStr, seed, onRetry, onNew, onHome, best, friendTime }) {
  const [showSol, setShowSol] = useState(false);
  const [sheet, setSheet] = useState(false);
  const [copied, setCopied] = useState(false);
  const sol = useMemo(() => E.solutions(sc.cards.map(c => c.seats))[0].map(i => sc.cards[i]), [sc]);
  const url = shareUrl(daily ? 'daily' : 'classic', daily ? dateStr : seed, r.won ? r.time : null);
  const text = r.won ? 'הצלחתי להגיע ל־61 ב־' + r.time.toFixed(1) + ' שניות. יש לך דקה לשבור את הזמן?' : '61 — יש לך דקה. תצליח להגיע ל־61 בדיוק?';
  const picked = r.picks.map(id => sc.cards.find(c => c.id === id));
  const share = async () => {
    if (navigator.share) { try { await navigator.share({ title: '61 — יש לך דקה', text, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    setSheet(true);
  };
  const copy = async () => {
    try { await navigator.clipboard.writeText(text + '\n' + url); setCopied(true); }
    catch (e) { const ta = document.getElementById('share-text'); ta && (ta.select(), document.execCommand && document.execCommand('copy'), setCopied(true)); }
  };
  const beatFriend = r.won && friendTime != null ? (r.time < friendTime ? 'עקפת את החבר ב־' + (friendTime - r.time).toFixed(1) + ' שניות' : 'החבר עדיין מהיר יותר ב־' + (r.time - friendTime).toFixed(1)) : null;

  return html`<div className=${'screen result ' + (r.won ? 'win' : 'lose')}>
    <div className="res-chamber"><${Chamber} fills=${fillsFor(sc.cards, showSol ? sol.map(c => c.id) : r.picks)} /></div>
    ${r.won ? html`
      <h2 className="res-title">61! הצלחת</h2>
      <p className="res-time"><span>${r.time.toFixed(1)}</span> שניות</p>
      <p className="res-meta">${picked.length} כרטיסים · ${r.taps} נגיעות${best != null ? html` · השיא שלך${daily ? ' היום' : ''}: <b>${best.toFixed(1)}</b>` : ''}</p>
      ${beatFriend && html`<p className="res-friend">${beatFriend}</p>`}`
    : html`
      <h2 className="res-title">כמעט!</h2>
      <p className="res-sub">נגמר הזמן. עצרת על <b>${r.sum}</b> — ${r.sum === 0 ? 'לא נבחרו כרטיסים' : r.sum > 61 ? 'עברת ב־' + (r.sum - 61) : 'חסרו ' + (61 - r.sum)}.</p>`}

    <ul className="chips" aria-label=${showSol ? 'פתרון אפשרי' : 'הכרטיסים שבחרת'}>
      ${(showSol ? sol : picked).map(c => html`<li key=${c.id} style=${{ '--c': c.color }}><${Icon} name=${c.icon} size=${16} />${c.nameHe} <b>${c.seats}</b></li>`)}
    </ul>
    ${showSol && html`<p className="res-meta">פתרון אפשרי אחד מתוך ${E.solutions(sc.cards.map(c => c.seats)).length}</p>`}

    <div className="ctas">
      ${r.won ? html`<button className="btn primary" onClick=${share} autoFocus>אתגר חבר</button>
                     <button className="btn ghost" onClick=${onRetry}>שחק שוב</button>`
        : html`<button className="btn primary" onClick=${onRetry} autoFocus>עוד ניסיון</button>
               ${!showSol && html`<button className="btn ghost" onClick=${() => setShowSol(true)}>הצג פתרון</button>`}
               <button className="btn ghost" onClick=${share}>אתגר חבר</button>`}
      <div className="row">
        ${!daily && html`<button className="btn text" onClick=${onNew}>סיבוב חדש</button>`}
        <button className="btn text" onClick=${onHome}>למסך הראשי</button>
      </div>
    </div>
    <${Badge} />

    ${sheet && html`<div className="sheet-wrap" onClick=${e => e.target === e.currentTarget && setSheet(false)}>
      <div className="sheet" role="dialog" aria-modal="true" aria-label="שיתוף">
        <h2>שלח את האתגר</h2>
        <textarea id="share-text" readOnly value=${text + '\n' + url} rows="3" />
        <a className="btn primary wa" href=${'https://wa.me/?text=' + encodeURIComponent(text + '\n' + url)} target="_blank" rel="noopener">וואטסאפ</a>
        <button className="btn ghost" onClick=${copy}>${copied ? 'הקישור הועתק' : 'העתק קישור'}</button>
        <button className="btn text" onClick=${() => setSheet(false)}>סגור</button>
      </div></div>`}
    ${r.won && html`<span className="sr" aria-live="assertive">הצלחת, ${r.time.toFixed(1)} שניות</span>`}
  </div>`;
}

/* ---------- coalition announcement ---------- */
function Announcement({ r, sc, onRetry, onHome, friendTime, onDaily }) {
  const [revealed, setRevealed] = useState(REDUCED);
  const [sheet, setSheet] = useState(false), [copied, setCopied] = useState(false);
  useEffect(() => { if (!REDUCED) { const t = setTimeout(() => setRevealed(true), 1400); return () => clearTimeout(t); } }, []);
  const pm = r.won ? E.primeMinister(sc.cards, r.picks) : null;
  const picked = r.picks.map(id => sc.cards.find(c => c.id === id)).sort((a, b) => b.seats - a.seats);
  const pmName = pm && (pm.names.length > 1 ? 'רוטציה: ' + pm.names.join(' ו') : pm.names[0]);
  const url = shareUrl('coalition', null, r.won ? r.time : null);
  const text = r.won ? 'הרכבתי קואליציה של ' + r.sum + ' מנדטים ב־' + r.time.toFixed(1) + ' שניות. ראש הממשלה: ' + pmName + '. איזו ממשלה אתה היית מקים? (משחק על בסיס ממוצע סקרים)'
    : 'יש לך דקה להרכיב רוב של 61. תצליח? (משחק על בסיס ממוצע סקרים)';
  const share = async () => {
    if (navigator.share) { try { await navigator.share({ title: '61 — יש לך דקה', text, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    setSheet(true);
  };
  const copy = async () => { try { await navigator.clipboard.writeText(text + '\n' + url); setCopied(true); } catch (e) { const ta = document.getElementById('share-text'); ta && (ta.select(), document.execCommand && document.execCommand('copy'), setCopied(true)); } };

  return html`<div className=${'screen result ' + (r.won ? 'win' : 'lose')}>
    <div className="res-chamber"><${Chamber} fills=${fillsFor(sc.cards, r.picks)} /></div>
    ${r.won ? html`
      <p className="ann-kicker">${revealed ? 'ראש הממשלה בקואליציה שהרכבת' : 'סופרים מנדטים…'}</p>
      ${revealed ? html`<h2 className="ann-name">${pmName}</h2>
        <p className="ann-party">ראש ${pm.lists.map(c => c.nameHe).join(' ו')} · ${pm.lists[0].seats} מנדטים</p>`
      : html`<div className="ann-drum" aria-hidden="true"><i/><i/><i/></div>`}
      <p className="res-meta">${r.sum} מנדטים · ${picked.length} רשימות · ${r.time.toFixed(1)} שניות</p>
      ${friendTime != null && html`<p className="res-friend">${r.time < friendTime ? 'הקמת ממשלה מהר יותר מהחבר ב־' + (friendTime - r.time).toFixed(1) + ' שניות' : 'החבר הקים ממשלה מהר יותר ב־' + (r.time - friendTime).toFixed(1)}</p>`}`
    : html`
      <h2 className="res-title">לא הוקמה ממשלה</h2>
      <p className="res-sub">נגמר הזמן עם <b>${r.sum}</b> מנדטים — חסרו ${61 - r.sum} לרוב. הולכים לבחירות חוזרות.</p>`}
    <ul className="chips" aria-label="הרשימות בקואליציה">
      ${picked.map(c => html`<li key=${c.id} style=${{ '--c': c.color }}>${c.nameHe} <b>${c.seats}</b></li>`)}
    </ul>
    ${r.won && html`<p className="rule">כלל המשחק: ראש הרשימה הגדולה בקואליציה הוא ראש הממשלה. זו פישוט של המשחק, לא תחזית.</p>`}
    <div className="ctas">
      ${r.won ? html`<button className="btn primary" onClick=${share} autoFocus>שתף את הממשלה שלך</button>
                     <button className="btn ghost" onClick=${onRetry}>הרכב קואליציה אחרת</button>`
        : html`<button className="btn primary" onClick=${onRetry} autoFocus>עוד ניסיון</button>
               <button className="btn ghost" onClick=${share}>אתגר חבר</button>`}
      <div className="row"><button className="btn text" onClick=${onDaily}>אתגר 61 בדיוק</button><button className="btn text" onClick=${onHome}>למסך הראשי</button></div>
    </div>
    <${SourceNote} sc=${sc} />
    <${Badge} polls=${true} />
    ${sheet && html`<div className="sheet-wrap" onClick=${e => e.target === e.currentTarget && setSheet(false)}>
      <div className="sheet" role="dialog" aria-modal="true" aria-label="שיתוף">
        <h2>שתף</h2>
        <textarea id="share-text" readOnly value=${text + '\n' + url} rows="4" />
        <a className="btn primary wa" href=${'https://wa.me/?text=' + encodeURIComponent(text + '\n' + url)} target="_blank" rel="noopener">וואטסאפ</a>
        <button className="btn ghost" onClick=${copy}>${copied ? 'הקישור הועתק' : 'העתק קישור'}</button>
        <button className="btn text" onClick=${() => setSheet(false)}>סגור</button>
      </div></div>`}
    ${r.won && revealed && html`<span className="sr" aria-live="assertive">ראש הממשלה: ${pmName}</span>`}
  </div>`;
}

/* ---------- app ---------- */
function App() {
  const today = useMemo(() => E.israelDate(), []);
  const link = useMemo(parseHash, []);
  const [sound, setSoundS] = useState(!!store.get('sound'));
  const setSound = v => { setSoundS(v); store.set('sound', v); if (v) beep([660], 0.06); };
  const [view, setView] = useState('intro');
  const viewRef = useRef(view); viewRef.current = view;
  const [live, setLive] = useState({ sc: E.POLLS, hidden: false });
  useEffect(() => {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 4000);
    fetch(ELECTION.pollsUrl + '?h=' + Math.floor(Date.now() / 36e5), { signal: ctl.signal })
      .then(r => r.ok ? r.json() : null)
      .then(d => { if (!d || viewRef.current !== 'intro') return; if (d.hidden) setLive({ sc: E.POLLS, hidden: true }); else { const sc = E.pollsFromData(d); if (sc) setLive({ sc, hidden: false }); } })
      .catch(() => {}).finally(() => clearTimeout(t));
    return () => ctl.abort();
  }, []);
  const pollsOpen = !live.hidden && today < ELECTION.pollsHiddenFrom;
  const [mode, setMode] = useState(link ? link.mode : pollsOpen ? 'coalition' : 'classic');
  const [dateStr, setDate] = useState(link && link.date ? link.date : today);
  const [seed, setSeed] = useState(link && link.mode === 'classic' ? link.seed : 0);
  const [friendTime] = useState(link ? link.friendTime : null);
  const [result, setResult] = useState(null);
  const [round, setRound] = useState(0);
  const sc = useMemo(() => mode === 'coalition' ? live.sc : mode === 'daily' ? E.dailyScenario(dateStr) : E.classicScenario(seed), [mode, dateStr, seed, live]);
  const bestKey = 'best:' + sc.id + ':v' + sc.version;
  const [best, setBest] = useState(null);

  const play = (m, opts = {}) => { userActed = true; setMode(m); if (opts.date) setDate(opts.date); if (opts.seed != null) setSeed(opts.seed); setRound(r => r + 1); setView('game'); };
  const finish = r => {
    if (r.won) { const b = store.get(bestKey); const nb = b == null || r.time < b ? r.time : b; store.set(bestKey, nb); setBest(nb); } else setBest(store.get(bestKey));
    setResult(r); setView('result');
  };
  // the site header (title + countdown) shows on the intro only; game and result screens get the whole viewport
  const mounted = useRef(false);
  useEffect(() => {
    document.body.dataset.view = view;
    if (mounted.current) window.scrollTo(0, 0);
    mounted.current = true;
  }, [view]);

  if (view === 'intro') return html`<${Intro} today=${today} sound=${sound} setSound=${setSound} pollsOpen=${pollsOpen} pollsSc=${live.sc}
    onPolls=${() => play('coalition')}
    onClassic=${() => play('classic', { seed: link && link.mode === 'classic' ? 1 + Math.floor(Math.random() * 1e6) : seed })}
    onDaily=${() => play('daily', { date: today })}
    friend=${link && friendTime != null && (link.mode !== 'coalition' || pollsOpen) ? { time: friendTime, polls: link.mode === 'coalition', go: () => play(link.mode, link.mode === 'daily' ? { date: link.date } : link.mode === 'classic' ? { seed: link.seed } : {}) } : null} />`;
  if (view === 'game') return html`<${Game} key=${round} sc=${sc} daily=${mode === 'daily'} dateStr=${dateStr} sound=${sound} setSound=${setSound}
    onExit=${() => setView('intro')} onFinish=${finish} />`;
  if (mode === 'coalition') return html`<${Announcement} r=${result} sc=${sc} friendTime=${friendTime}
    onRetry=${() => play('coalition')} onHome=${() => setView('intro')} onDaily=${() => play('daily', { date: today })} />`;
  return html`<${Result} r=${result} sc=${sc} daily=${mode === 'daily'} dateStr=${dateStr} seed=${seed} best=${best}
    friendTime=${friendTime} onRetry=${() => play(mode)} onNew=${() => play('classic', { seed: 1 + Math.floor(Math.random() * 1e6) })}
    onHome=${() => setView('intro')} />`;
}

ReactDOM.createRoot(document.getElementById('game-root')).render(html`<${App} />`);
})();
</script>
</body>
</html>
